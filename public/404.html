<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>STACKY // Next-Gen European Fleet & Logistics System</title>
    <script type="text/javascript">
      // SPA redirect for GitHub Pages and custom root domains
      var l = window.location;
      var isGithubPages = l.hostname.indexOf('github.io') > -1;
      var pathSegmentsToKeep = isGithubPages ? 1 : 0;
      var basePath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var routePath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        basePath + '/?/' +
        routePath +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
